# inst/config/shiny.yml

# A default profile and configuration data model
default:
  app:
    app_name: "Water Quality Explorer"
    figure_defaults:
      show_legend: true
      font_size: 20
      # colors should exist in files.colors_csv
      good_color: "Blue"
      bad_color: "Orange"
      out_color: "Vermillion"
      point_size: 6
      threshold_line_color: "Orange"
      tr_line_color: "Green"
      line_width: 2
      show_point: true
      figure_horizontal_scaling: 0.9
      figure_vertical_scaling: 0.7

  files:
    colors_csv: "extdata/colors.csv"
    dataset_url: "https://irma.nps.gov/DataStore/"  # generic fallback
    datadir: "Data"
    imagesdir: "img" # subfolder of datadir/network (e.g., Data/NCRN), folder for data-images that the app lets the user interact with
    splashdir: "splash" # subfolder of datadir/network (e.g., Data/NCRN), folder for splash-screen images

  wqx:
    enabled: true

  time:
    min_year: "auto"
    max_year: "auto"

# Network profiles that override defaults for each provided kwarg
NCRN:
  app:
    app_name: "Stream Water Quality"
    network_code: "NCRN"
    network_long: "National Capital Region Network"
    dataset_url: "https://irma.nps.gov/DataStore/Reference/Profile/2317661"
    splash:
      loading_text:
        - "Loading application..."
        - "Loading application..."
        - "Loading application..."
      loading_images:
        - src: "dwq_NCRN_ANTI_SHCK_2024-06-04_20240604-131442.jpg"
          location: "Antietam National Battlefield, Sharpsburg Creek"
          date: "2024-06-04"
          alt: "Sharpsburg Creek at ANTI SHCK"
        - src: "dwq_NCRN_MONO_BUCK_2024-06-04_20240604-084406.jpg"
          location: "Monocacy National Battlefield, Bush Creek"
          date: "2024-06-04"
          alt: "Bush Creek at MONO BUCK"
        - src: "dwq_NCRN_PRWI_BONE_2024-06-11_20240611-130821.jpg"
          location: "Prince William Forest Park, Boneyard Run"
          date: "2024-06-11"
          alt: "Boneyard Run at PRWI BONE"

  files:
    dataname: "wqp.csv"
    metadataname: "wqp_ncrnwater_metadata.csv"

  wqx:
    enabled: true

NETN:
  app:
    app_name: "Stream Water Quality"
    network_code: "NETN"
    network_long: "Northeast Temperate Network"

  files:
    dataname: "wqp.csv"
    metadataname: "wqp_ncrnwater_metadata.csv"

